name: CI

on:
  push:
    branches: [main, feat/**]
  pull_request:
    branches: [main]

jobs:
  # ── 1. Vitest unit tests ────────────────────────────────────────────────────
  unit-test:
    name: Unit Tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run unit tests
        run: npm run test:unit

  # ── 2. Build (depends on unit tests passing) ────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [unit-test]
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://coil.5am.team
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

  # ── 3. Playwright E2E against the checked-out change ───────────────────────
  e2e-test:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_SUPABASE_URL: https://coil.5am.team
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.COIL_APP_NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      # Optional: set these secrets in GitHub to enable auth-gated settings tests
      E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
      E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build checked-out app
        run: npm run build

      - name: Start checked-out app
        run: |
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public
          node .next/standalone/server.js > /tmp/coil-e2e.log 2>&1 &
          npx wait-on http://127.0.0.1:3000 --timeout 60000

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

name: Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

jobs:
  deploy-preview:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Apply and verify intentional-living DB migration
        run: |
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          ssh -i /tmp/deploy_key -o StrictHostKeyChecking=no deploy@178.156.188.200 \
            "docker exec -i supabase-db-1 psql -U postgres -d postgres -v ON_ERROR_STOP=1" <<'SQL'
          begin;

          create table if not exists public.cycles (
            id uuid primary key default public.uuid_generate_v7(),
            user_id uuid not null,
            starts_on date not null,
            ends_on date not null,
            must_win text not null default '',
            territories jsonb not null default '{}'::jsonb,
            status text not null default 'active' check (status in ('active', 'completed')),
            created_at timestamptz not null default now(),
            updated_at timestamptz not null default now(),
            check (ends_on >= starts_on),
            unique (user_id, starts_on, ends_on)
          );

          create table if not exists public.period_reviews (
            id uuid primary key default public.uuid_generate_v7(),
            user_id uuid not null,
            review_type text not null check (review_type in ('month', 'quarter')),
            starts_on date not null,
            ends_on date not null,
            responses jsonb not null default '{}'::jsonb,
            snapshot jsonb not null default '{}'::jsonb,
            created_at timestamptz not null default now(),
            updated_at timestamptz not null default now(),
            check (ends_on >= starts_on),
            unique (user_id, review_type, starts_on)
          );

          alter table public.cycles enable row level security;
          alter table public.period_reviews enable row level security;

          do $body$ begin
            if not exists (
              select from pg_policies where schemaname = 'public' and tablename = 'cycles' and policyname = 'users manage own cycles'
            ) then
              create policy "users manage own cycles" on public.cycles
                for all using ((select auth.uid()) = user_id)
                with check ((select auth.uid()) = user_id);
            end if;
            if not exists (
              select from pg_policies where schemaname = 'public' and tablename = 'period_reviews' and policyname = 'users manage own period reviews'
            ) then
              create policy "users manage own period reviews" on public.period_reviews
                for all using ((select auth.uid()) = user_id)
                with check ((select auth.uid()) = user_id);
            end if;
          end $body$;

          grant all on public.cycles to authenticated;
          grant all on public.period_reviews to authenticated;
          commit;
          select pg_notify('pgrst', 'reload schema');

          do $verify$ begin
            if (select count(*) from pg_class c join pg_namespace n on n.oid = c.relnamespace
                where n.nspname = 'public' and c.relname in ('cycles', 'period_reviews') and c.relrowsecurity) <> 2 then
              raise exception 'Migration verification failed: tables or RLS missing';
            end if;
            if (select count(*) from pg_policies
                where schemaname = 'public' and policyname in ('users manage own cycles', 'users manage own period reviews')) <> 2 then
              raise exception 'Migration verification failed: policies missing';
            end if;
          end $verify$;
          select 'MIGRATION_VERIFIED=cycles,period_reviews';
          SQL

      - name: Build Docker image
        run: |
          SAFE_BRANCH=$(echo "${{ github.head_ref }}" | tr '/' '-' | tr '_' '-' | tr '[:upper:]' '[:lower:]' | cut -c1-30)
          PREVIEW_URL="https://coil-${SAFE_BRANCH}.5am.team"
          docker build \
            --build-arg NEXT_PUBLIC_SUPABASE_URL="${PREVIEW_URL}" \
            --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY="${{ secrets.COIL_APP_NEXT_PUBLIC_SUPABASE_ANON_KEY }}" \
            --build-arg NEXT_PUBLIC_SITE_URL="${PREVIEW_URL}" \
            --build-arg NEXT_PUBLIC_APP_URL="${PREVIEW_URL}" \
            --build-arg NEXT_PUBLIC_BUILD_VERSION="preview-${GITHUB_SHA::7}" \
            --build-arg NEXT_PUBLIC_GIT_BRANCH="${{ github.head_ref }}" \
            -t "coil-preview-${SAFE_BRANCH}:latest" .
          docker save "coil-preview-${SAFE_BRANCH}:latest" -o /tmp/preview-image.tar

      - name: Copy image to server
        run: |
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          SAFE_BRANCH=$(echo "${{ github.head_ref }}" | tr '/' '-' | tr '_' '-' | tr '[:upper:]' '[:lower:]' | cut -c1-30)
          scp -i /tmp/deploy_key -o StrictHostKeyChecking=no \
            /tmp/preview-image.tar \
            deploy@178.156.188.200:/tmp/coil-preview-${SAFE_BRANCH}.tar

      - name: Deploy preview
        run: |
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          SAFE_BRANCH=$(echo "${{ github.head_ref }}" | tr '/' '-' | tr '_' '-' | tr '[:upper:]' '[:lower:]' | cut -c1-30)
          ssh -i /tmp/deploy_key -o StrictHostKeyChecking=no deploy@178.156.188.200 "
            docker load -i /tmp/coil-preview-${SAFE_BRANCH}.tar
            rm /tmp/coil-preview-${SAFE_BRANCH}.tar
            /opt/coil/deploy-preview.sh '${{ github.head_ref }}' 'coil-preview-${SAFE_BRANCH}:latest'
          "

  comment-preview-url:
    runs-on: ubuntu-latest
    needs: deploy-preview
    if: always() && github.event.action != 'closed'
    permissions:
      pull-requests: write
    steps:
      - name: Comment preview URL on PR
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.payload.pull_request.head.ref;
            const safeBranch = branch.replace(/[/_]/g, '-').toLowerCase().slice(0, 30);
            const url = `https://coil-${safeBranch}.5am.team`;
            const deployStatus = '${{ needs.deploy-preview.result }}';
            const statusIcon = deployStatus === 'success' ? '✅' : '⚠️';
            const statusNote = deployStatus === 'success'
              ? 'Updates automatically on each push.'
              : `Deploy job status: \`${deployStatus}\` — preview may not be up yet.`;
            const body = `${statusIcon} **Preview URL:** ${url}\n\n${statusNote}`;
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.data.find(c => c.body.includes('Preview URL:'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  destroy-preview:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Destroy preview
        run: |
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          ssh -i /tmp/deploy_key -o StrictHostKeyChecking=no deploy@178.156.188.200 \
            "/opt/coil/destroy-preview.sh '${{ github.head_ref }}'"

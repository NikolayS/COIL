name: Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

jobs:
  deploy-preview:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Diagnose July fasting storage
        run: |
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          RESULT=$(ssh -i /tmp/deploy_key -o StrictHostKeyChecking=no deploy@178.156.188.200 \
            "docker exec -i supabase-db-1 psql -U postgres -d postgres -At" <<'SQL'
          with target_user as (
            select id from auth.users where email = 'nik@postgres.ai' limit 1
          ), day_rows as (
            select
              week.week_of + ((case day.key
                when 'sun' then 0 when 'mon' then 1 when 'tue' then 2 when 'wed' then 3
                when 'thu' then 4 when 'fri' then 5 when 'sat' then 6
              end - extract(dow from week.week_of)::integer + 7) % 7) as day_date,
              day.value as data
            from public.weeks week
            cross join lateral jsonb_each(week.data->'days') day
            where week.user_id = (select id from target_user)
              and week.week_of >= date '2026-06-28'
              and week.week_of <= date '2026-07-31'
          )
          select 'JULY_NESTED_TRUE_DATES=' || count(distinct day_date)
          from day_rows
          where day_date between date '2026-07-01' and date '2026-07-31'
            and data->'trackers'->>'fasting' = 'true'
          union all
          select 'JULY_LEGACY_TRUE_DATES=' || count(distinct day_date)
          from day_rows
          where day_date between date '2026-07-01' and date '2026-07-31'
            and data->>'fasting' = 'true'
          union all
          select 'FASTING_DEFINITIONS=' || coalesce(string_agg(
            tracker->>'id' || ':' || coalesce(tracker->>'enabled', 'true'), ',' order by tracker->>'id'
          ), 'none')
          from public.settings settings
          cross join lateral jsonb_array_elements(coalesce(settings.tracker_definitions, '[]'::jsonb)) tracker
          where settings.user_id = (select id from target_user)
            and lower(tracker->>'label') = 'fasting';
          SQL
          )
          echo "FASTING_STORAGE_RESULT=${RESULT}"

      - name: Build Docker image
        run: |
          SAFE_BRANCH=$(echo "${{ github.head_ref }}" | tr '/' '-' | tr '_' '-' | tr '[:upper:]' '[:lower:]' | cut -c1-30)
          PREVIEW_URL="https://coil-${SAFE_BRANCH}.5am.team"
          docker build \
            --build-arg NEXT_PUBLIC_SUPABASE_URL="${PREVIEW_URL}" \
            --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY="${{ secrets.COIL_APP_NEXT_PUBLIC_SUPABASE_ANON_KEY }}" \
            --build-arg NEXT_PUBLIC_SITE_URL="${PREVIEW_URL}" \
            --build-arg NEXT_PUBLIC_APP_URL="${PREVIEW_URL}" \
            --build-arg NEXT_PUBLIC_BUILD_VERSION="preview-${GITHUB_SHA::7}" \
            --build-arg NEXT_PUBLIC_GIT_BRANCH="${{ github.head_ref }}" \
            -t "coil-preview-${SAFE_BRANCH}:latest" .
          docker save "coil-preview-${SAFE_BRANCH}:latest" -o /tmp/preview-image.tar

      - name: Copy image to server
        run: |
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          SAFE_BRANCH=$(echo "${{ github.head_ref }}" | tr '/' '-' | tr '_' '-' | tr '[:upper:]' '[:lower:]' | cut -c1-30)
          scp -i /tmp/deploy_key -o StrictHostKeyChecking=no \
            /tmp/preview-image.tar \
            deploy@178.156.188.200:/tmp/coil-preview-${SAFE_BRANCH}.tar

      - name: Deploy preview
        run: |
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          SAFE_BRANCH=$(echo "${{ github.head_ref }}" | tr '/' '-' | tr '_' '-' | tr '[:upper:]' '[:lower:]' | cut -c1-30)
          ssh -i /tmp/deploy_key -o StrictHostKeyChecking=no deploy@178.156.188.200 "
            docker load -i /tmp/coil-preview-${SAFE_BRANCH}.tar
            rm /tmp/coil-preview-${SAFE_BRANCH}.tar
            /opt/coil/deploy-preview.sh '${{ github.head_ref }}' 'coil-preview-${SAFE_BRANCH}:latest'
          "

  comment-preview-url:
    runs-on: ubuntu-latest
    needs: deploy-preview
    if: always() && github.event.action != 'closed'
    permissions:
      pull-requests: write
    steps:
      - name: Comment preview URL on PR
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.payload.pull_request.head.ref;
            const safeBranch = branch.replace(/[/_]/g, '-').toLowerCase().slice(0, 30);
            const url = `https://coil-${safeBranch}.5am.team`;
            const deployStatus = '${{ needs.deploy-preview.result }}';
            const statusIcon = deployStatus === 'success' ? '✅' : '⚠️';
            const statusNote = deployStatus === 'success'
              ? 'Updates automatically on each push.'
              : `Deploy job status: \`${deployStatus}\` — preview may not be up yet.`;
            const body = `${statusIcon} **Preview URL:** ${url}\n\n${statusNote}`;
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.data.find(c => c.body.includes('Preview URL:'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  destroy-preview:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Destroy preview
        run: |
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          ssh -i /tmp/deploy_key -o StrictHostKeyChecking=no deploy@178.156.188.200 \
            "/opt/coil/destroy-preview.sh '${{ github.head_ref }}'"
